# ============================================================
# 自动构建 + 自动发布
# ------------------------------------------------------------
# 作用：每次你把改动推送到本仓库（st4awber-hexo-source）的 master 分支，
#       GitHub 会自动在它的服务器上执行下面这些步骤：
#         1. 拉取源码
#         2. 安装 Node.js 20
#         3. npm ci 安装依赖
#         4. hexo generate 生成静态网页到 public/
#         5. 把 public/ 的内容推送到 st4awber.github.io 仓库的 main 分支
#       推送完成后约 1~2 分钟，https://st4awber.github.io 就会更新。
#
# 你不需要在自己电脑上装 Node、Hexo 或 git。
# 也可以在网页上手动触发：仓库 → Actions → 选本工作流 → Run workflow
# ============================================================

name: 自动构建并发布博客

on:
  push:
    branches:
      - master
  # 允许在 GitHub 网页上点按钮手动运行
  workflow_dispatch:
  # 定时心跳：每季度第一天自动重建一次，防止流程长期不用后失效
  schedule:
    - cron: '0 0 1 1,4,7,10 *'

# 同一时间只跑一个部署任务，避免两次推送互相覆盖
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取源码。submodules: false 是因为主题已作为普通目录提交进仓库
      - name: 1. 拉取源码
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # 2. 准备 Node.js（Hexo 8 需要 Node 20 或更高）
      - name: 2. 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 按 package-lock.json 精确安装依赖，保证每次构建结果一致
      - name: 3. 安装依赖
        run: npm ci --no-audit --no-fund

      # 4. 生成静态网页
      - name: 4. 生成静态网页
        run: npx hexo generate

      # 5. 发布。DEPLOY_TOKEN 是你在仓库 Secrets 里配置的 Personal Access Token
      #    用 x-access-token 作为用户名是 GitHub 推荐的令牌认证写法；
      #    GitHub 会自动把日志里出现的令牌打码成 ***。
      #    先给仓库加一个 .nojekyll 空文件：GitHub Pages 默认用 Jekyll 处理站点，
      #    会忽略以 _ 开头的文件/目录。加了 .nojekyll 才不会被误处理。
      - name: 5. 发布到 st4awber.github.io
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          cd public
          touch .nojekyll
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site updated: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          git remote add origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/st4awber/st4awber.github.io.git"
          git push -f origin deploy:main
